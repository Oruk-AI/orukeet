name: Package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[eval]" pytest build
      - run: python scripts/sync_citation.py --check
      - run: python -m pytest -q
      - run: python -m pytest -q training/gabor_half/test_optimizer_groups.py
      - run: python training/selection/test_evaluation.py
      - run: python -m build
      - run: orukeet --help
