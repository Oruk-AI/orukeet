name: Core ML English comparison

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'export/coreml/english-comparison/**'
      - 'export/coreml/benchmark/**'
      - 'export/coreml/verify_bundle.py'
      - '.github/workflows/coreml-english.yml'
  pull_request:
    paths:
      - 'export/coreml/english-comparison/**'
      - 'export/coreml/benchmark/**'
      - 'export/coreml/verify_bundle.py'
      - '.github/workflows/coreml-english.yml'

permissions:
  contents: read

concurrency:
  group: coreml-english-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paired-english:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      ORUKEET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set scratch and evidence paths
        run: |
          echo "ORUKEET_COMPARISON_ROOT=$RUNNER_TEMP/orukeet-english" >> "$GITHUB_ENV"
          echo "ORUKEET_COMPARISON_EVIDENCE=$RUNNER_TEMP/orukeet-english-evidence" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/orukeet-english" "$RUNNER_TEMP/orukeet-english-evidence"
      - name: Test fixed-reference scoring
        run: python3 -m unittest discover -s export/coreml/english-comparison -p 'test_*.py' -v
      - name: Stage pinned English v2 inference assets and sealed audio
        # Public inference models remain only on this ephemeral CI runner.
        # No training checkpoints are used and artifacts exclude model files.
        run: |
          python3 export/coreml/english-comparison/stage.py \
            --destination "$ORUKEET_COMPARISON_ROOT"
      - name: Stage and authenticate portable Orukeet inference assets
        run: |
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 300 \
            'https://huggingface.co/oruk/orukeet/resolve/43142dd1897f9ddadcd70173fcb5ff45c08aa951/coreml/orukeet-r3-coreml-greedy.zip?download=true' \
            --output "$ORUKEET_COMPARISON_ROOT/greedy.zip"
          python3 export/coreml/verify_bundle.py \
            --archive "$ORUKEET_COMPARISON_ROOT/greedy.zip" \
            --output "$ORUKEET_COMPARISON_EVIDENCE/archive-verification.json"
          python3 - <<'PY'
          import os, pathlib, zipfile
          root = pathlib.Path(os.environ['ORUKEET_COMPARISON_ROOT'])
          with zipfile.ZipFile(root / 'greedy.zip') as archive:
              archive.extractall(root)
          PY
      - name: Transcribe identical recordings and score word errors
        run: |
          set -o pipefail
          python3 export/coreml/english-comparison/run.py \
            --v2-models "$ORUKEET_COMPARISON_ROOT/v2" \
            --audio-root "$ORUKEET_COMPARISON_ROOT/audio" \
            --orukeet-packages "$ORUKEET_COMPARISON_ROOT/orukeet-r3-coreml-greedy" \
            --orukeet-archive "$ORUKEET_COMPARISON_ROOT/greedy.zip" \
            --output "$ORUKEET_COMPARISON_EVIDENCE/results" \
            --encoder-units ane 2>&1 | tee "$ORUKEET_COMPARISON_EVIDENCE/comparison.log"
      - name: Record checkout and runtime provenance
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          evidence = pathlib.Path(os.environ['ORUKEET_COMPARISON_EVIDENCE'])
          evidence.mkdir(parents=True, exist_ok=True)
          sources = [
              'export/coreml/benchmark/Sources/OrukeetCoreML/OrukeetEngine.swift',
              'export/coreml/english-comparison/Sources/EnglishComparison/main.swift',
              'export/coreml/english-comparison/fixtures.json',
              'export/coreml/english-comparison/v2-assets.json',
              'export/coreml/english-comparison/score.py',
          ]
          report = {
              'head_sha': os.environ['ORUKEET_HEAD_SHA'],
              'checkout_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'ci_run': os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY']
                        + '/actions/runs/' + os.environ['GITHUB_RUN_ID'],
              'source_sha256': {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in sources},
              'xcode': subprocess.check_output(['xcodebuild', '-version'], text=True).strip(),
              'swift': subprocess.check_output(['xcrun', 'swift', '--version'], text=True).strip(),
              'scope': 'Paired 16-recording reused English regression diagnostic on macOS',
              'limitations': ['Not an English release benchmark or a basis to change the default model.',
                             'Not a physical-iPhone accuracy or performance qualification.',
                             'Compiled v2 models do not establish portable-source iOS compatibility.'],
          }
          (evidence / 'provenance.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
      - name: Preserve transcripts and evidence without models or audio
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orukeet-english16-comparison
          path: |
            ${{ runner.temp }}/orukeet-english-evidence/provenance.json
            ${{ runner.temp }}/orukeet-english-evidence/archive-verification.json
            ${{ runner.temp }}/orukeet-english-evidence/comparison.log
            ${{ runner.temp }}/orukeet-english-evidence/results/*.json
            ${{ runner.temp }}/orukeet-english-evidence/results/*.md
            ${{ runner.temp }}/orukeet-english-evidence/results/*.log
          if-no-files-found: warn
          retention-days: 14
